const c=document.getElementById('c'),x=c.getContext('2d'),W=400,H=600;
let ac;function snd(f,d,t='square',s=0,v=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.linearRampToValueAtTime(f+s,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const sfx={jump:()=>snd(300,.15,'square',300),spring:()=>snd(400,.35,'sine',900),tramp:()=>snd(250,.5,'sine',1200),brk:()=>snd(120,.25,'sawtooth',-80),stomp:()=>snd(500,.2,'triangle',-300),die:()=>snd(400,.7,'sawtooth',-350),rocket:()=>snd(90,.5,'sawtooth',200)};
let keys={},tx=0,p,pl,en,it,score,best=+(localStorage.getItem('dh')||0),over,lastY,rk;
const MON=['m0','m1','m2','m3','m4'];
function dw(n,cx,y,w,fl){const i=I[n],h=w*i.height/i.width;x.save();x.translate(cx,0);if(fl)x.scale(-1,1);x.drawImage(i,-w/2,y-h,w,h);x.restore();return h}
function reset(){p={x:200,y:480,vy:-12,d:1};pl=[{x:200,y:540,t:0}];en=[];it=[];score=0;over=0;lastY=540;rk=0;gen()}
function gen(){while(lastY>-60){const g=Math.min(60+score/60,115);lastY-=g*(.6+Math.random()*.4);const r=Math.random(),sc=score;let t=0;
if(r>.62)t=1;if(sc>300&&r>.8)t=2;if(r>.9)t=3;if(sc>1500&&r>.94)t=4;
const P={x:40+Math.random()*320,y:lastY,t,dx:1+Math.random()*1.5,b:0};pl.push(P);
if(t==0||t==1){const q=Math.random();if(q<.06)it.push({k:'tr',p:P});else if(q<.09&&sc>500)it.push({k:'rk',p:P})}
if(sc>800&&Math.random()<.12){const u=Math.random()<.3;en.push({n:u?'ufo':MON[Math.random()*5|0],x:60+Math.random()*280,y:lastY-60,ph:Math.random()*6,u,ox:0})}}}
function upd(){if(over)return;
let m=0;if(keys.ArrowLeft||keys.a)m=-1;if(keys.ArrowRight||keys.d)m=1;if(tx)m=tx;
p.x+=m*5.5;if(m)p.d=m;if(p.x<0)p.x=W;if(p.x>W)p.x=0;
if(rk>0){rk--;p.vy=-16}else p.vy+=.45;p.y+=p.vy;
if(p.vy>0&&!rk)for(const q of pl){if(q.b)continue;if(Math.abs(p.x-q.x)<38&&p.y>q.y&&p.y-p.vy<=q.y+4&&p.y<q.y+16){
if(q.t==2){q.b=1;sfx.brk();continue}if(q.t==4){fin();return}p.vy=q.t==3?-20:-12.5;q.t==3?sfx.spring():sfx.jump();}}
for(const q of pl)if(q.t==1){q.x+=q.dx;if(q.x<40||q.x>360)q.dx*=-1}
for(const q of pl)if(q.b)q.y+=8;
for(const e of en){e.ph+=.05;e.ox=Math.sin(e.ph)*30;const ex=e.x+e.ox;
if(Math.abs(p.x-ex)<30&&Math.abs(p.y-30-e.y)<35){if(p.vy>0&&p.y-30<e.y&&!e.u){e.dead=1;p.vy=-12;score+=50;sfx.stomp()}else if(!rk){fin();return}}}
en=en.filter(e=>!e.dead&&e.y<H+80);
for(const i of it){const ix=i.p.x;if(Math.abs(p.x-ix)<30&&Math.abs(p.y-(i.p.y))<22&&!i.u){if(i.k=='tr'&&p.vy>0){p.vy=-25;i.u=1;sfx.tramp()}if(i.k=='rk'){rk=110;i.u=1;sfx.rocket()}}}
if(p.y<H*.4){const d=H*.4-p.y;p.y+=d;score+=d|0;lastY+=d;for(const a of [...pl,...en])a.y+=d;}
pl=pl.filter(q=>q.y<H+40);it=it.filter(i=>!i.u&&pl.includes(i.p));
gen();if(p.y>H+60)fin()}
function fin(){over=1;sfx.die();if(score>best){best=score;try{localStorage.setItem('dh',best)}catch(e){}}}
const PN=['pg','pb','pbr','psp','spk'];
function draw(){x.clearRect(0,0,W,H);
x.strokeStyle='#e4e0d0';x.lineWidth=1;for(let i=0;i<W;i+=25){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=25){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
for(const q of pl)dw(PN[q.t],q.x,q.y+14,72);
for(const i of it){i.k=='tr'?dw('tr',i.p.x,i.p.y+8,48):dw('rk',i.p.x,i.p.y+2,26)}
for(const e of en)dw(e.n,e.x+e.ox,e.y+30,e.u?62:50);
dw('p',p.x,p.y,52,p.d<0);
if(rk>0)dw('rk',p.x-p.d*20,p.y-6,22);
x.fillStyle='#222';x.font='bold 22px sans-serif';x.textAlign='left';x.fillText(score,12,30);x.textAlign='right';x.fillText('рекорд '+best,W-12,30);
if(over){x.fillStyle='rgba(250,248,240,.85)';x.fillRect(0,0,W,H);x.fillStyle='#222';x.textAlign='center';x.font='bold 36px sans-serif';x.fillText('Игра окончена',W/2,250);x.font='24px sans-serif';x.fillText('Счёт: '+score,W/2,295);x.fillText('Тап — играть снова',W/2,350)}}

addEventListener('keydown',e=>{keys[e.key]=1;if(over&&e.key==' ')reset()});addEventListener('keyup',e=>keys[e.key]=0);
function T(e){const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;tx=t.clientX<r.left+r.width/2?-1:1}
c.addEventListener('touchstart',e=>{e.preventDefault();if(over){reset();return}ac=ac||new (window.AudioContext||window.webkitAudioContext)();T(e)},{passive:false});
c.addEventListener('touchend',()=>tx=0);c.addEventListener('mousedown',e=>{if(over){reset();return}T(e)});c.addEventListener('mouseup',()=>tx=0);
